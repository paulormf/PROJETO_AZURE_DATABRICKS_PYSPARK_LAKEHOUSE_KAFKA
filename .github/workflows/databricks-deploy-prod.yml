name: Deploy Databricks - Prod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Validar e publicar no target prod
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Databricks CLI
        uses: databricks/setup-cli@v1.22.1

      - name: Validar Bundle de producao
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --target prod

      - name: Fazer deploy no target prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy --target prod
