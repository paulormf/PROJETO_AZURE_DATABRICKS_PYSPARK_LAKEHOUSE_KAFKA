[project]
name = "projeto-azure-databricks-pyspark-lakehouse-kafka"
version = "0.1.0"
description = "Projeto de engenharia de dados ponta a ponta com Azure, Databricks, PySpark, Delta Lake e Kafka."
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32,<3.0",
    "python-dotenv>=1.0,<2.0",
    "databricks-connect==18.0.*",
    "databricks-sql-connector>=3.0.0,<4.0.0",
    "pyspark>=3.5.0,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
