version: 2

models:
  - name: dim_category
    description: "Dimensão de categorias de produtos."
    columns:
      - name: category_id
        tests:
          - not_null
          - unique

  - name: dim_brand
    description: "Dimensão de marcas de produtos."
    columns:
      - name: brand_id
        tests:
          - not_null
          - unique

  - name: dim_sales_channel
    description: "Dimensão de canais de venda."
    columns:
      - name: sales_channel_id
        tests:
          - not_null
          - unique

  - name: dim_product
    description: "Dimensão de produtos sem dados pessoais de clientes."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: product_name
        tests:
          - not_null
      - name: category_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_category')
                field: category_id
      - name: brand_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_brand')
                field: brand_id

  - name: fct_sales_daily
    description: "Fato diário de vendas sem dados pessoais de clientes."
    columns:
      - name: order_date
        tests:
          - not_null
      - name: order_count
        tests:
          - not_null
      - name: net_sales
        tests:
          - not_null
      - name: sales_channel_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_sales_channel')
                field: sales_channel_id
