targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-b5359fb2-170e.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/vscode
    variables:
      azsql_host: "treinamento.database.windows.net"
      azsql_database: "free-sql-db-5098886"

