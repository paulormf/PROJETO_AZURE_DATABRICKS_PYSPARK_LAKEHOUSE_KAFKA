# Esta é a definição do Declarative Automation Bundle de PROJETO_AZURE_DATABRICKS_PYSPARK_LAKEHOUSE_KAFKA.
# A extensão do Databricks exige o arquivo de configuração databricks.yml.
# Consulte https://docs.databricks.com/dev-tools/bundles/index.html para obter a documentação.

bundle:
  name: PROJETO_AZURE_DATABRICKS_PYSPARK_LAKEHOUSE_KAFKA

sync:
  exclude:
    - .pytest_cache/**
    - .venv/**
    - .git/**
    - .databricks/**
    - artifacts/**
    - __pycache__/**
    - .env
    - dbt/profiles.yml
    - dbt/target/**
    - dbt/logs/**
    - dbt/dbt_packages/**

variables:
  azsql_host:
    description: Host público do Azure SQL por ambiente.
    default: "treinamento.database.windows.net"
  azsql_database:
    description: Nome do banco de dados Azure SQL por ambiente.
    default: "free-sql-db-5098886"
  sql_warehouse_id:
    description: ID do SQL Warehouse usado pelo dbt.
    default: "f2e5f28843021f70"

resources:
  jobs:
    test_azsql_to_s3:
      name: "${bundle.name}-${bundle.target}-test-azsql-to-s3"
      parameters:
        - name: sql_host
          default: ${var.azsql_host}
        - name: sql_database
          default: ${var.azsql_database}
      tasks:
        - task_key: test_azsql_to_s3
          notebook_task:
            notebook_path: ./notebooks/01_test_azsql_to_s3.py

    bronze_ingestion:
      name: "${bundle.name}-${bundle.target}-bronze-ingestion"
      parameters:
        - name: sql_host
          default: ${var.azsql_host}
        - name: sql_database
          default: ${var.azsql_database}
        - name: source_schema
          default: dbo
        - name: source_table
          default: carriers
        - name: load_mode
          default: full
        - name: watermark_column
          default: ""
        - name: last_watermark
          default: ""
        - name: watermark_path
          default: "s3://lakehouse-prj-db-kafka/lakehouse/control/bronze_watermarks_v2/"
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py

    bronze_two_tables:
      name: "${bundle.name}-${bundle.target}-bronze-two-tables"
      tasks:
        - task_key: bronze_products
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py
            base_parameters:
              sql_host: ${var.azsql_host}
              sql_database: ${var.azsql_database}
              source_schema: dbo
              source_table: products
              load_mode: incremental
              watermark_column: updated_at
              last_watermark: ""
              watermark_path: "s3://lakehouse-prj-db-kafka/lakehouse/control/bronze_watermarks_v2/"

        - task_key: bronze_carriers
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py
            base_parameters:
              sql_host: ${var.azsql_host}
              sql_database: ${var.azsql_database}
              source_schema: dbo
              source_table: carriers
              load_mode: full
              watermark_column: ""
              last_watermark: ""
              watermark_path: "s3://lakehouse-prj-db-kafka/lakehouse/control/bronze_watermarks_v2/"

        - task_key: bronze_brands
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py
            base_parameters:
              sql_host: ${var.azsql_host}
              sql_database: ${var.azsql_database}
              source_schema: dbo
              source_table: brands
              load_mode: incremental
              watermark_column: "updated_at"
              last_watermark: ""
              watermark_path: "s3://lakehouse-prj-db-kafka/lakehouse/control/bronze_watermarks_v2/"

        - task_key: bronze_campaigns
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py
            base_parameters:
              sql_host: ${var.azsql_host}
              sql_database: ${var.azsql_database}
