          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py
            base_parameters:
              sql_host: ${var.azsql_host}
              sql_database: ${var.azsql_database}
              source_schema: dbo
              source_table: sales_channels
              load_mode: full
              watermark_column: ""
              last_watermark: ""
              watermark_path: "s3://lakehouse-prj-db-kafka/lakehouse/control/bronze_watermarks_v2/"

        - task_key: bronze_shipments
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py
            base_parameters:
              sql_host: ${var.azsql_host}
              sql_database: ${var.azsql_database}
              source_schema: dbo
              source_table: shipments
              load_mode: incremental
              watermark_column: "updated_at"
              last_watermark: ""
              watermark_path: "s3://lakehouse-prj-db-kafka/lakehouse/control/bronze_watermarks_v2/"

        - task_key: bronze_suppliers
          notebook_task:
            notebook_path: ./notebooks/02_bronze_ingestion.py
