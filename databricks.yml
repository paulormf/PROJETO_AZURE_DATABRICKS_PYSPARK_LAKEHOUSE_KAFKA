              last_watermark: ""
              watermark_path: "s3://lakehouse-prj-db-kafka/lakehouse/control/bronze_watermarks_v2/"

    silver_two_tables:
      name: "${bundle.name}-${bundle.target}-silver-gold"
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "America/Sao_Paulo"
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      environments:
        - environment_key: dbt_serverless
          spec:
            environment_version: "2"
            dependencies:
              - "dbt-databricks>=1.6.0,<2.0.0"
      tasks:
        - task_key: silver_products
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: products
              primary_keys: product_id

        - task_key: silver_carriers
          depends_on:
            - task_key: silver_products
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: carriers
              primary_keys: carrier_id
        - task_key: silver_brands
          depends_on:
            - task_key: silver_carriers
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: brands
              primary_keys: brand_id

        - task_key: silver_campaigns
          depends_on:
            - task_key: silver_brands
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: campaigns
              primary_keys: campaign_id

        - task_key: silver_categories
          depends_on:
            - task_key: silver_campaigns
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: categories
              primary_keys: category_id

        - task_key: silver_customer_addresses
          depends_on:
            - task_key: silver_categories
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: customer_addresses
              primary_keys: address_id

        - task_key: silver_customer_campaigns
          depends_on:
            - task_key: silver_customer_addresses
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: customer_campaigns
              primary_keys: ""

        - task_key: silver_customer_contacts
          depends_on:
            - task_key: silver_customer_campaigns
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: customer_contacts
              primary_keys: contact_id

        - task_key: silver_customers
          depends_on:
            - task_key: silver_customer_contacts
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: customers
              primary_keys: customer_id

        - task_key: silver_departments
          depends_on:
            - task_key: silver_customers
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: departments
              primary_keys: department_id

        - task_key: silver_employees
          depends_on:
            - task_key: silver_departments
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: employees
              primary_keys: employee_id

        - task_key: silver_inventory_balance
          depends_on:
            - task_key: silver_employees
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: inventory_balance
              primary_keys: ""

        - task_key: silver_inventory_movements
          depends_on:
            - task_key: silver_inventory_balance
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: inventory_movements
              primary_keys: movement_id

        - task_key: silver_order_items
          depends_on:
            - task_key: silver_inventory_movements
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: order_items
              primary_keys: order_item_id

        - task_key: silver_orders
          depends_on:
            - task_key: silver_order_items
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: orders
              primary_keys: order_id

        - task_key: silver_payment_transactions
          depends_on:
            - task_key: silver_orders
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: payment_transactions
              primary_keys: transaction_id

        - task_key: silver_payments
          depends_on:
            - task_key: silver_payment_transactions
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: payments
              primary_keys: payment_id

        - task_key: silver_returns
          depends_on:
            - task_key: silver_payments
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: returns
              primary_keys: return_id

        - task_key: silver_sales_channels
          depends_on:
            - task_key: silver_returns
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: sales_channels
              primary_keys: sales_channel_id

        - task_key: silver_shipments
          depends_on:
            - task_key: silver_sales_channels
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: shipments
              primary_keys: shipment_id

        - task_key: silver_suppliers
          depends_on:
            - task_key: silver_shipments
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: suppliers
              primary_keys: supplier_id

        - task_key: silver_warehouses
          depends_on:
            - task_key: silver_suppliers
          notebook_task:
            notebook_path: ./notebooks/03_silver_delta.py
            base_parameters:
              source_schema: dbo
              source_table: warehouses
              primary_keys: warehouse_id

        - task_key: register_silver_tables
          depends_on:
            - task_key: silver_warehouses
          sql_task:
            file:
              path: "/Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/vscode/files/sql/register_silver_external_tables.sql"
              source: WORKSPACE
            warehouse_id: ${var.sql_warehouse_id}

        - task_key: gold_dbt_after_silver
          depends_on:
            - task_key: register_silver_tables
          environment_key: dbt_serverless
          dbt_task:
            commands:
              - "dbt deps"
              - "dbt build --select +fct_sales_daily"
            project_directory: "/Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/vscode/files/dbt"
            source: WORKSPACE
            warehouse_id: ${var.sql_warehouse_id}
            catalog: main
            schema: default

        - task_key: monitoring_quality_after_gold
          depends_on:
            - task_key: gold_dbt_after_silver
          notebook_task:
            notebook_path: ./notebooks/04_monitoring_quality.py

    monitoring_quality:
      name: "${bundle.name}-${bundle.target}-monitoring-quality"
      tasks:
        - task_key: monitoring_quality
          notebook_task:
            notebook_path: ./notebooks/04_monitoring_quality.py

    kinesis_bronze_ingestion:
      name: "${bundle.name}-${bundle.target}-kinesis-bronze"
      max_concurrent_runs: 1
      tasks:
        - task_key: kinesis_to_bronze
          notebook_task:
            notebook_path: ./notebooks/07_kinesis_to_bronze.py
            base_parameters:
              stream_arn: "arn:aws:kinesis:us-east-1:693000032696:stream/lakehouse-sales-events"
              aws_region: us-east-1
              bronze_path: "s3://lakehouse-prj-db-kafka/lakehouse/bronze/kinesis/sales-events/"
              checkpoint_path: "s3://lakehouse-prj-db-kafka/lakehouse/checkpoints/kinesis/sales-events-v8/"
              initial_position: earliest

        - task_key: kinesis_to_silver
          depends_on:
            - task_key: kinesis_to_bronze
          notebook_task:
            notebook_path: ./notebooks/08_kinesis_silver_delta.py
            base_parameters:
              bronze_path: "s3://lakehouse-prj-db-kafka/lakehouse/bronze/kinesis/sales-events/"
              silver_path: "s3://lakehouse-prj-db-kafka/lakehouse/silver/kinesis/sales-events/"

    performance_baseline:
      name: "${bundle.name}-${bundle.target}-performance-baseline"
      tasks:
        - task_key: performance_baseline
          notebook_task:
            notebook_path: ./notebooks/06_performance_baseline.py
            base_parameters:
              source_schema: dbo
              source_table: order_items
              primary_keys: order_item_id

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-b5359fb2-170e.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/vscode
    variables:
      azsql_host: "treinamento.database.windows.net"
      azsql_database: "free-sql-db-5098886"
      sql_warehouse_id: "f2e5f28843021f70"

  ## Opcionalmente, podem ser adicionados alvos 'staging' ou 'prod' aqui.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-b5359fb2-170e.cloud.databricks.com
