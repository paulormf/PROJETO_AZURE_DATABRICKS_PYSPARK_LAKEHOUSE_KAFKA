<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do projeto Azure SQL, Databricks e Lakehouse</title>
  <desc id="desc">Fluxo batch do Azure SQL para o Databricks, armazenamento Parquet no Amazon S3, camadas Bronze, Silver e Gold em Delta Lake, dbt e Unity Catalog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#93c5fd"/></marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 700 18px Arial, sans-serif; fill: #f8fafc; }
      .small { font: 400 14px Arial, sans-serif; fill: #dbeafe; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #cbd5e1; }
      .box { stroke: #64748b; stroke-width: 1.5; rx: 16; filter: url(#shadow); }
      .iconText { font: 700 20px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="760" fill="url(#bg)"/>
  <text x="70" y="64" class="title">Lakehouse de dados — fluxo implementado</text>
  <text x="70" y="94" class="subtitle">Azure SQL → Databricks Serverless → Amazon S3 → Unity Catalog / dbt</text>

  <rect x="70" y="160" width="230" height="150" class="box" fill="#075985"/>
  <circle cx="125" cy="215" r="32" fill="#0ea5e9"/><text x="125" y="215" class="iconText">SQL</text>
  <text x="165" y="210" class="label">Azure SQL</text><text x="165" y="237" class="small">Origem relacional</text>
  <text x="95" y="280" class="tiny">Carga incremental por updated_at</text><text x="95" y="299" class="tiny">ou full load sem watermark</text>

  <rect x="370" y="160" width="250" height="150" class="box" fill="#312e81"/>
  <circle cx="425" cy="215" r="32" fill="#f97316"/><text x="425" y="215" class="iconText">DBX</text>
  <text x="465" y="210" class="label">Databricks</text><text x="465" y="237" class="small">PySpark / Jobs</text>
  <text x="395" y="280" class="tiny">Bundles e execução Serverless</text><text x="395" y="299" class="tiny">Secrets para credenciais</text>

  <rect x="690" y="160" width="230" height="150" class="box" fill="#713f12"/>
  <circle cx="745" cy="215" r="32" fill="#f59e0b"/><text x="745" y="215" class="iconText">S3</text>
  <text x="785" y="210" class="label">Amazon S3</text><text x="785" y="237" class="small">Data Lake</text>
  <text x="715" y="280" class="tiny">Parquet na ingestão</text><text x="715" y="299" class="tiny">Delta nas camadas tratadas</text>

  <path d="M300 235 H360" class="arrow"/><path d="M620 235 H680" class="arrow"/>

  <text x="70" y="380" class="label">Camadas do Lakehouse</text>
  <rect x="70" y="410" width="420" height="190" class="box" fill="#78350f"/>
  <rect x="95" y="438" width="86" height="42" rx="10" fill="#f59e0b"/><text x="138" y="459" class="iconText">B</text>
  <text x="205" y="459" class="label">Bronze</text><text x="100" y="515" class="small">Dados brutos em Parquet</text>
  <text x="100" y="542" class="small">Metadados de ingestão</text><text x="100" y="569" class="small">Controle de watermark</text>

  <rect x="550" y="410" width="420" height="190" class="box" fill="#164e63"/>
  <rect x="575" y="438" width="86" height="42" rx="10" fill="#06b6d4"/><text x="618" y="459" class="iconText">S</text>
  <text x="685" y="459" class="label">Silver</text><text x="580" y="515" class="small">Delta Lake deduplicado</text>
  <text x="580" y="542" class="small">Validação de chaves primárias</text><text x="580" y="569" class="small">Auditoria e reconciliação</text>

  <rect x="1030" y="410" width="420" height="190" class="box" fill="#581c87"/>
  <rect x="1055" y="438" width="86" height="42" rx="10" fill="#a855f7"/><text x="1098" y="459" class="iconText">G</text>
  <text x="1165" y="459" class="label">Gold</text><text x="1060" y="515" class="small">Dimensões e fatos analíticos</text>
  <text x="1060" y="542" class="small">Modelagem com dbt</text><text x="1060" y="569" class="small">Testes e documentação</text>

  <path d="M805 310 V350 H280 V400" class="arrow"/><path d="M805 350 H760 V400" class="arrow"/><path d="M805 350 H1240 V400" class="arrow"/>

  <rect x="70" y="650" width="300" height="65" rx="14" fill="#1e3a8a" stroke="#60a5fa"/>
  <text x="220" y="680" class="label" text-anchor="middle">Unity Catalog</text><text x="220" y="702" class="tiny" text-anchor="middle">tabelas, views e governança</text>
  <rect x="410" y="650" width="300" height="65" rx="14" fill="#134e4a" stroke="#2dd4bf"/>
  <text x="560" y="680" class="label" text-anchor="middle">Qualidade</text><text x="560" y="702" class="tiny" text-anchor="middle">métricas, auditoria e LGPD</text>
  <rect x="750" y="650" width="300" height="65" rx="14" fill="#365314" stroke="#a3e635"/>
  <text x="900" y="680" class="label" text-anchor="middle">Performance</text><text x="900" y="702" class="tiny" text-anchor="middle">Photon, shuffle e cache</text>
  <rect x="1090" y="650" width="360" height="65" rx="14" fill="#4c1d95" stroke="#c084fc"/>
  <text x="1270" y="680" class="label" text-anchor="middle">Databricks Asset Bundles</text><text x="1270" y="702" class="tiny" text-anchor="middle">deploy reproduzível por ambiente</text>
</svg>
